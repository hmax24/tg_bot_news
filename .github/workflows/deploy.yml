name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE_NAME: ghcr.io/hmax24/tg_bot_news

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build test image
        run: |
          docker build \
            --platform linux/amd64 \
            --target build \
            --tag tg-news-tests \
            .

      - name: Run tests
        run: |
          docker run --rm \
            tg-news-tests \
            npm test -- --runInBand

      - name: Build production image
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/hmax24/tg_bot_news" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            .

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish image
        run: docker push "$IMAGE_NAME:$GITHUB_SHA"

      - name: Logout
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Validate deployment script
        run: bash -n scripts/deploy.sh

      - name: Deploy to DigitalOcean
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$GITHUB_SHA'" \
            < scripts/deploy.sh

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
