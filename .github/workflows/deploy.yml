name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE_NAME: ghcr.io/hmax24/tg_bot_news

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build test image
        run: |
          docker build \
            --platform linux/amd64 \
            --target build \
            --tag tg-news-tests \
            .

      - name: Run tests
        run: |
          docker run --rm \
            tg-news-tests \
            npm test -- --runInBand

      - name: Build production image
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/hmax24/tg_bot_news" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            .

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish image
        run: docker push "$IMAGE_NAME:$GITHUB_SHA"

      - name: Logout
        if: always()
        run: docker logout ghcr.io